name: Verify PX4 development environment
on: [push, pull_request, workflow_dispatch]
jobs:
  static:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/static.sh
      - name: Lint Dockerfile (apt updates and resolved Python dependencies are intentional)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3008 --ignore DL3013 - < Dockerfile
  image:
    # Full image builds are intentionally opt-in: several GB of packages and sources.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: ./001_build_px4_ros2_image.sh
      - run: ./tests/image-smoke.sh px4_ros2_vnc:latest
      - run: ./tests/desktop.sh
      - run: |
          docker run --name px4-ci --mount type=bind,src="$PWD/Projects",dst=/home/user/Projects --mount type=bind,src="$PWD/Data",dst=/home/user/Data px4_ros2_vnc:latest bash -ec 'setup_px4_workspace; build_px4_sitl; build_ros2_workspace; source ~/Projects/ros2_workspace/install/setup.bash; /opt/px4-tests/sensors.sh; /opt/px4-tests/flight.sh'
      - if: always()
        run: docker logs px4-ci > Data/ci.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-evidence
          path: Data/
